<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../brand.css">
  <style>
    #stage {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 24px;
    }
    #title {
      font-family: var(--font-display);
      font-size: 120px; font-weight: 700; letter-spacing: -0.02em;
      color: var(--fg);
    }
    #bar { height: 8px; background: var(--accent); border-radius: 4px; }
    #sub { font-size: 36px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="title">Hello from my studio</div>
    <div id="bar"></div>
    <div id="sub">claude-motion · test render</div>
  </div>

  <script>
    window.DURATION = 3;            // seconds
    window.SIZE = [1920, 1080];     // width, height

    const ease = x => 1 - Math.pow(1 - x, 3);           // ease-out cubic
    const clamp01 = x => Math.min(1, Math.max(0, x));

    // Draw the exact frame at time t (seconds). Pure function of t.
    window.render = function (t) {
      const title = document.getElementById('title');
      const bar = document.getElementById('bar');
      const sub = document.getElementById('sub');

      // 0.0–0.8s: title fades in and rises
      const a = ease(clamp01(t / 0.8));
      title.style.opacity = a;
      title.style.transform = `translateY(${(1 - a) * 40}px)`;

      // 0.5–1.5s: accent bar grows left to right
      const b = ease(clamp01((t - 0.5) / 1.0));
      bar.style.width = `${b * 640}px`;

      // 1.2–2.0s: subtitle fades in
      const c = ease(clamp01((t - 1.2) / 0.8));
      sub.style.opacity = c;

      // 2.5–3.0s: everything fades out
      const out = 1 - clamp01((t - 2.5) / 0.5);
      document.getElementById('stage').style.opacity = out;
    };
  </script>
</body>
</html>
